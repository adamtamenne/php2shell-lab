; =============================================================
; php2shell lab configuration
; Each setting maps to a specific CVE's attack surface.
; =============================================================

; --- CVE-2026-109618: OOM corruption ---
; The attack requires pushing PHP past memory_limit during request
; parsing. A low limit makes this trivially reachable.
; post_max_size must be HIGHER than memory_limit so PHP accepts
; the payload before the allocator hits the wall.
memory_limit = 32M
post_max_size = 256M
upload_max_filesize = 256M

; --- CVE-2026-109619: stale global state ---
; session.upload_progress.enabled is the confirmed trigger path.
; When enabled, PHP tracks upload progress in the session, and
; the state it creates can survive into the next request on the
; same worker after the backing memory is freed.
session.upload_progress.enabled = 1
session.upload_progress.cleanup = 1
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
session.save_path = /tmp

; --- General: make errors visible for lab observation ---
display_errors = On
error_reporting = E_ALL
log_errors = On
max_input_vars = 1000000
