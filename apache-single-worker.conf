# Optional: force a single Apache worker for deterministic testing
# of CVE-2026-109619 (both requests must hit the same worker).
#
# Mount this into the container:
#   -v $(pwd)/apache-single-worker.conf:/etc/apache2/conf-enabled/single-worker.conf
#
# This is prefork MPM config. The php:*-apache image uses prefork
# because mod_php is not thread-safe.

# One worker process only. Every request goes to the same PID.
<IfModule mpm_prefork_module>
    StartServers          1
    MinSpareServers       1
    MaxSpareServers       1
    MaxRequestWorkers     1
    MaxConnectionsPerChild 0
</IfModule>
